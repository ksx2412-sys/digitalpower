[build]
  command = "npm run build"
  publish = "dist"

# SPA — wszystkie ścieżki (/, /de, /en) obsługuje index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache: assets z hashem — na rok
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
